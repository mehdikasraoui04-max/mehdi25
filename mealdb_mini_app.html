<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MealDB - Test Viewer</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#fafafa;color:#111;padding:20px}
    .container{max-width:900px;margin:0 auto}
    h1{font-size:24px;margin-bottom:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{background:#fff;border:1px solid #e6e6e6;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.04)}
    .card img{width:100%;height:160px;object-fit:cover;display:block}
    .card-body{padding:12px}
    .meal-title{font-weight:700;margin:0 0 6px 0}
    .empty{padding:40px;text-align:center;color:#666}
    pre { background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto }
    .note{font-size:13px;color:#444;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="container">
    <h1>MealDB — Local Test Viewer</h1>
    <div class="note">This page reads <code>mealdb_mini_app.json</code> (same folder) and renders meals. It also includes the sample JSON embedded as a fallback for offline viewing.</div>

    <div id="meals" class="grid"></div>

    <h2>Raw data (for debugging)</h2>
    <pre id="raw"></pre>
  </div>

  <!-- Embedded fallback JSON so the page works without fetch -->
  <script id="data" type="application/json">{
  "meals": [
    {
      "idMeal": "52772",
      "strMeal": "Teriyaki Chicken",
      "strMealThumb": "https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg"
    }
  ]
}</script>

  <script>
    async function loadData(){
      const out = document.getElementById('meals');
      const raw = document.getElementById('raw');
      // Try to fetch the JSON file in same folder first
      try{
        const resp = await fetch('mealdb_mini_app.json', {cache: 'no-store'});
        if(resp.ok){
          const data = await resp.json();
          render(data);
          raw.textContent = JSON.stringify(data, null, 2);
          return;
        }
      }catch(e){
        // fetch may fail when opened as file:// in some browsers; we'll fall back to embedded JSON
        console.warn('Fetch failed, using embedded JSON', e);
      }

      // Fallback: use embedded JSON inside the page
      try{
        const txt = document.getElementById('data').textContent;
        const data = JSON.parse(txt);
        render(data);
        raw.textContent = JSON.stringify(data, null, 2);
      }catch(e){
        out.innerHTML = '<div class="empty">No data available.</div>';
        raw.textContent = 'No data';
      }
    }

    function render(data){
      const out = document.getElementById('meals');
      const meals = (data && data.meals) || [];
      if(!meals.length){ out.innerHTML = '<div class="empty">No meals found in data.</div>'; return }
      out.innerHTML = meals.map(m=>`
        <div class="card">
          <img src="${m.strMealThumb}" alt="${escapeHtml(m.strMeal)}" />
          <div class="card-body">
            <div class="meal-title">${escapeHtml(m.strMeal)}</div>
            <div>id: ${m.idMeal}</div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

    loadData();
  </script>
</body>
</html>
